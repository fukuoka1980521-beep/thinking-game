<script>
const params=new URLSearchParams(location.search);
const DEFAULT_ENDPOINT="https://newlife-refoundation-ai-zqtk74q2ra-an.a.run.app";
const endpoint=params.get("endpoint")||DEFAULT_ENDPOINT;
const statusEl=document.getElementById("status");
const consentCard=document.getElementById("consentCard");
const game=document.getElementById("game");
const transcriptEl=document.getElementById("transcript");
const input=document.getElementById("utterance");
const send=document.getElementById("send");
const debug=document.getElementById("debug");
const thought=document.getElementById("thought");
let target=null,busy=false,remainingMinutes=50,boundaryStatus="UNKNOWN",relationship={MIKA:"NEUTRAL",RYO:"NEUTRAL"},activeCommitment=null,sceneRevisionText=null,sceneRevisionSummary=null;
const MAX_NPC_EXCHANGE_TURNS=3;
const history=[];

function safeEndpoint(url){try{const u=new URL(url);return u.protocol==="https:"&&(u.hostname.endsWith(".run.app")||u.hostname.endsWith(".cloudfunctions.net"))}catch{return false}}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]))}
function addLine(who,text,cls){history.push({speaker:who,text});transcriptEl.insertAdjacentHTML("beforeend",'<div class="line '+cls+'"><span class="who">'+esc(who==="PLAYER"?"縺ゅ↑縺・:who==="MIKA"?"鄒朱ｦ・:who==="RYO"?"莠ｮ":"繧ｷ繧ｹ繝・Β")+':</span> '+esc(text)+'</div>');transcriptEl.scrollTop=transcriptEl.scrollHeight}
function recentDialogue(){return history.slice(-8).map(x=>({speaker:x.speaker,text:x.text}))}
function isNpcId(id){return id==="MIKA"||id==="RYO"}
function applySceneRevisionProposal(data){
  const proposal=data?.sceneRevisionProposal;
  if(!proposal||proposal.hasProposal!==true||typeof proposal.revisedText!=="string"||!proposal.revisedText.trim())return false;
  sceneRevisionText=proposal.revisedText.trim();
  sceneRevisionSummary=typeof proposal.changeSummary==="string"?proposal.changeSummary.trim():"";
  document.getElementById("revisionText").textContent=sceneRevisionText;
  document.getElementById("revisionSummary").textContent=sceneRevisionSummary?("螟画峩轤ｹ: "+sceneRevisionSummary):"";
  document.getElementById("revisionPanel").style.display="block";
  return true;
}
function currentDynamicState(npc){
  return {
    relationshipState:relationship[npc],
    boundaryStatus,
    remainingMinutes,
    activeCommitment,
    sceneRevisionText
  };
}

async function post(body){
  let lastError=null;
  for(let attempt=1;attempt<=2;attempt++){
    const ctrl=new AbortController();
    const timer=setTimeout(()=>ctrl.abort(),45000);
    try{
      const res=await fetch(endpoint,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body),signal:ctrl.signal});
      const textBody=await res.text();
      let data;try{data=JSON.parse(textBody)}catch{throw new Error("AI蠢懃ｭ斐′JSON縺ｧ縺ｯ縺ゅｊ縺ｾ縺帙ｓ")}
      if(!res.ok){const e=new Error(data?.error||("HTTP "+res.status));e.status=res.status;throw e}
      return data;
    }catch(err){
      lastError=err;
      const retryable=!err?.status||err.status===502||err.name==="AbortError";
      if(attempt===1&&retryable){await new Promise(r=>setTimeout(r,700));continue}
      throw err;
    }finally{clearTimeout(timer)}
  }
  throw lastError||new Error("AI謗･邯壹↓螟ｱ謨励＠縺ｾ縺励◆");
}

function selectTarget(id){
  if(busy)return;
  target=id;
  document.getElementById("targetMika").setAttribute("aria-pressed",id==="MIKA");
  document.getElementById("targetRyo").setAttribute("aria-pressed",id==="RYO");
  input.placeholder=(id==="MIKA"?"鄒朱ｦ・:"莠ｮ")+"縺ｫ閾ｪ逕ｱ縺ｫ隧ｱ縺・;
  send.disabled=!input.value.trim()||busy;
  input.focus();
}

function setConversationBusy(value){
  busy=value;
  send.disabled=value||!target||!input.value.trim();
  document.getElementById("targetMika").disabled=value;
  document.getElementById("targetRyo").disabled=value;
}
document.getElementById("targetMika").onclick=()=>selectTarget("MIKA");
document.getElementById("targetRyo").onclick=()=>selectTarget("RYO");
input.oninput=()=>{send.disabled=!target||!input.value.trim()||busy};
input.onkeydown=e=>{if(e.key==="Enter"&&!e.isComposing)send.click()};


async function continueNpcExchange(initialData){
  let data=initialData;
  for(let depth=1;depth<=MAX_NPC_EXCHANGE_TURNS;depth++){
    if(data?.sceneStatus!=="NPC_EXCHANGE"||!isNpcId(data?.nextNpc))return data;
    const nextNpc=data.nextNpc;
    const last=history[history.length-1];
    if(!last||!isNpcId(last.speaker)||last.speaker===nextNpc)return data;
    const next=await post({
      operation:"continue_npc_exchange",
      caseId:"COMMUNITY_THEATER_V1",
      targetNpc:nextNpc,
      recentDialogue:recentDialogue(),
      continuationDepth:depth,
      dynamicState:currentDynamicState(nextNpc)
    });
    if(!next||next.npc!==nextNpc||typeof next.npcLine!=="string"||!next.npcLine.trim())throw new Error("NPC髢謎ｼ夊ｩｱ縺ｮ蠢懃ｭ泌ｽ｢蠑上′荳肴ｭ｣縺ｧ縺・);
    addLine(nextNpc,next.npcLine,nextNpc==="MIKA"?"mika":"ryo");
    applySceneRevisionProposal(next);
    remainingMinutes=Math.max(0,remainingMinutes-1);
    data=next;
    debug.textContent=JSON.stringify(data,null,2);
  }
  return data;
}
async function talk(){
  const utterance=input.value.trim();
  if(!utterance||!target||busy)return;
  const requestTarget=target;
  setConversationBusy(true);
  addLine("PLAYER",utterance,"you");
  input.value="";
  try{
    const data=await post({
      operation:"converse_turn",
      caseId:"COMMUNITY_THEATER_V1",
      targetNpc:requestTarget,
      rawPlayerUtterance:utterance,
      recentDialogue:recentDialogue().slice(0,-1),
      dynamicState:currentDynamicState(requestTarget)
    });
    debug.textContent=JSON.stringify(data,null,2);
    if(!data||data.npc!==requestTarget||typeof data.npcLine!=="string"||!data.npcLine.trim())throw new Error("莨夊ｩｱ蠢懃ｭ斐・蠖｢蠑上′荳肴ｭ｣縺ｧ縺・);
    addLine(requestTarget,data.npcLine,requestTarget==="MIKA"?"mika":"ryo");
    applySceneRevisionProposal(data);
    remainingMinutes=Math.max(0,remainingMinutes-2);
    await continueNpcExchange(data);
  }catch(err){
    addLine("SYSTEM","AI謗･邯壹お繝ｩ繝ｼ: "+(err?.message||String(err)),"system");
  }finally{
    setConversationBusy(false);
  }
}
send.onclick=talk;

document.getElementById("organize").onclick=async()=>{
  const btn=document.getElementById("organize");btn.disabled=true;
  try{
    const data=await post({
      operation:"organize_thought",
      validatedWorldFacts:"譏取律18:00縺悟・蝗槫・貍斐ゅメ繧ｱ繝・ヨ縺ｯ雋ｩ螢ｲ貂医∩縲・7:30縺ｾ縺ｧ縺ｫ蟇ｾ蠢懈婿驥昴ｒ豎ｺ繧√ｋ蠢・ｦ√′縺ゅｋ縲らｾ朱ｦ吶・迴ｾ迥ｶ縺ｮ蝣ｴ髱｢繧偵◎縺ｮ縺ｾ縺ｾ貍斐§繧九％縺ｨ繧呈拠蜷ｦ縺励※縺・ｋ縲ゆｺｮ縺ｯ莉翫°繧峨・螟画峩縺梧ｮｵ蜿悶ｊ縺ｫ蠖ｱ髻ｿ縺吶ｋ縺ｨ閠・∴縺ｦ縺・ｋ縲・,
      recentDialogue:recentDialogue(),
      currentProblem:"鄒朱ｦ吶→莠ｮ縺ｮ蟇ｾ遶九ｒ逅・ｧ｣縺励∵・譌･縺ｮ蜈ｬ貍斐ｒ縺ｩ縺・ｲ繧√ｋ縺区ｱｺ繧√ｋ縲・
    });
    const section=(title,arr)=>Array.isArray(arr)&&arr.length?'<p><strong>'+esc(title)+':</strong> '+arr.map(esc).join(" / ")+'</p>':"";
    thought.innerHTML='<h3>諤晁・紛逅・ｼ医く繝｣繝ｩ繧ｯ繧ｿ繝ｼ縺ｮ逋ｺ險縺ｧ縺ｯ縺ゅｊ縺ｾ縺帙ｓ・・/h3>'+
      section("繧上°縺｣縺ｦ縺・ｋ",data.known)+section("縺昴≧縺九ｂ縺励ｌ縺ｪ縺・,data.possible)+section("縺ｾ縺繧上°繧峨↑縺・,data.unknown)+section("驕ｸ謚櫁い",data.options)+
      (data.nextCheck?'<p><strong>谺｡縺ｫ遒ｺ縺九ａ繧九％縺ｨ:</strong> '+esc(data.nextCheck)+'</p>':"");
    thought.style.display="block";
  }catch(err){
    thought.innerHTML='<h3>諤晁・紛逅・/h3><p class="bad">蜿門ｾ怜､ｱ謨・ '+esc(err?.message||String(err))+'</p>';thought.style.display="block";
  }finally{btn.disabled=false}
};

async function verifyBackend(){
  if(!safeEndpoint(endpoint)){
    statusEl.className="status bad";
    statusEl.textContent="髫秘屬AI endpoint 縺御ｸ肴ｭ｣縺ｧ縺吶ゅユ繧ｹ繝医・髢句ｧ九〒縺阪∪縺帙ｓ縲・;
    return;
  }
  try{
    const ctrl=new AbortController();
    const timer=setTimeout(()=>ctrl.abort(),10000);
    const res=await fetch(endpoint,{method:"GET",signal:ctrl.signal});
    clearTimeout(timer);
    if(!res.ok)throw new Error("health HTTP "+res.status);
    const data=await res.json();
    if(!data||data.service!=="newlife-refoundation-ai"||typeof data.buildSha!=="string"||!data.buildSha.trim()||data.contractVersion!=="V45"||!Array.isArray(data.operations)||!data.operations.includes("continue_npc_exchange")){
      throw new Error("health response mismatch");
    }
    const shortSha=data.buildSha==="unknown"?"unknown":data.buildSha.slice(0,8);
    statusEl.className="status ok";
    statusEl.textContent="髫秘屬AI謗･邯夂｢ｺ隱肴ｸ医∩ / "+(data.contractVersion||"version unknown")+" / build "+shortSha;
    consentCard.style.display="block";
  }catch(err){
