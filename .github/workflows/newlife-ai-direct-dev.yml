name: NEW LIFE AI Direct Dev

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

concurrency:
  group: newlife-ai-direct-dev-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  claude:
    if: >-
      github.event.issue.number == 1 &&
      startsWith(github.event.comment.body, '[CHATGPT_TO_CLAUDE]')
    runs-on: ubuntu-latest
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

    steps:
      - name: Run Claude Code with OAuth token
        if: env.CLAUDE_CODE_OAUTH_TOKEN != ''
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          trigger_phrase: "[CHATGPT_TO_CLAUDE]"
          base_branch: "master"
          branch_prefix: "claude/newlife/"
          track_progress: true

      - name: Run Claude Code with API key fallback
        if: env.CLAUDE_CODE_OAUTH_TOKEN == '' && env.ANTHROPIC_API_KEY != ''
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          trigger_phrase: "[CHATGPT_TO_CLAUDE]"
          base_branch: "master"
          branch_prefix: "claude/newlife/"
          track_progress: true

      - name: Report one-time authentication setup requirement
        if: env.CLAUDE_CODE_OAUTH_TOKEN == '' && env.ANTHROPIC_API_KEY == ''
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                '[AI_AUTOMATION_AUTH_REQUIRED]',
                'The repository-local Claude workflow is installed, but no Claude authentication secret is configured.',
                'One-time setup: configure either CLAUDE_CODE_OAUTH_TOKEN or ANTHROPIC_API_KEY and ensure the Claude GitHub app is installed for this repository.',
                'After that, new [CHATGPT_TO_CLAUDE] comments on this issue will start Claude automatically.',
                'No product work was executed.'
              ].join('\n')
            });
