name: STGR v1.3b Blind Shift Annotation
on:
  workflow_dispatch:
  push:
    branches: [research/stgr-lscb-v13]
    paths: [research/stgr-lscb-v13/RUN_ANNOTATE_V13B]
permissions:
  contents: write
  id-token: write
jobs:
  annotate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          project_id: ${{ vars.STGR_GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.STGR_GCP_WIF_PROVIDER }}
          service_account: ${{ vars.STGR_GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python research/stgr-lscb-v13/annotate_v13b.py
      - name: Persist
        run: |
          git config user.name "stgr-research-bot"
          git config user.email "stgr-research-bot@users.noreply.github.com"
          git add research/stgr-lscb-v13/GEMINI_BLIND_SHIFT_ANNOTATION_V1_3B.json
          git commit -m "research(stgr): persist v1.3b Gemini shift annotations [skip ci]"
          git pull --rebase origin research/stgr-lscb-v13
          git push origin HEAD:research/stgr-lscb-v13
