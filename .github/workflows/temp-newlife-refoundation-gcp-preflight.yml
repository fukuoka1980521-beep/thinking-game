name: TEMP NEW LIFE Refoundation GCP Auth Preflight

on:
  push:
    branches:
      - chatgpt/newlife-refoundation-v1
    paths:
      - .github/workflows/temp-newlife-refoundation-gcp-preflight.yml

permissions:
  contents: read
  id-token: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Check repository variables without exposing values
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          [ -z "${{ vars.GCP_PROJECT_ID }}" ] && missing+=("GCP_PROJECT_ID")
          [ -z "${{ vars.GCP_WIF_PROVIDER }}" ] && missing+=("GCP_WIF_PROVIDER")
          [ -z "${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}" ] && missing+=("GCP_DEPLOY_SERVICE_ACCOUNT")
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::MISSING_GCP_WIF_VARIABLES=${missing[*]}"
            exit 20
          fi
          echo "GCP_WIF_VARIABLES_PRESENT=YES"

      - name: Authenticate through configured WIF
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Verify project access and required APIs (read-only)
        shell: bash
        run: |
          set -euo pipefail
          gcloud projects describe "${{ vars.GCP_PROJECT_ID }}" --format='value(projectId)' >/dev/null
          required=(aiplatform.googleapis.com cloudfunctions.googleapis.com cloudbuild.googleapis.com run.googleapis.com artifactregistry.googleapis.com)
          enabled="$(gcloud services list --enabled --project "${{ vars.GCP_PROJECT_ID }}" --format='value(config.name)')"
          missing=()
          for api in "${required[@]}"; do
            grep -qx "$api" <<< "$enabled" || missing+=("$api")
          done
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::MISSING_REQUIRED_APIS=${missing[*]}"
            exit 21
          fi
          echo "GCP_WIF_AUTH=PASS"
          echo "REQUIRED_APIS=PASS"
