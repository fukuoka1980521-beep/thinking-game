name: STGR v1.2 Sequential Momentum Pilot
on:
  workflow_dispatch:
  push:
    branches: [research/stgr-lscb-v12]
    paths: [research/stgr-lscb-v12/RUN_V12]
permissions:
  contents: write
  id-token: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          project_id: ${{ vars.STGR_GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.STGR_GCP_WIF_PROVIDER }}
          service_account: ${{ vars.STGR_GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m py_compile research/stgr-lscb-v12/run_v12.py
      - run: python research/stgr-lscb-v12/run_v12.py
      - name: Persist
        run: |
          git config user.name "stgr-research-bot"
          git config user.email "stgr-research-bot@users.noreply.github.com"
          git add research/stgr-lscb-v12/run_output
          git commit -m "research(stgr): persist v1.2 sequential result [skip ci]"
          git pull --rebase origin research/stgr-lscb-v12
          git push origin HEAD:research/stgr-lscb-v12
      - uses: actions/upload-artifact@v4
        with:
          name: STGR_SEQUENTIAL_RESULTS_V1_2
          path: research/stgr-lscb-v12/run_output/STGR_SEQUENTIAL_RESULTS_V1_2.zip
