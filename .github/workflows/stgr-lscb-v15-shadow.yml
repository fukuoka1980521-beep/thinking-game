name: STGR v1.5 Shadow Counterfactual

on:
  workflow_dispatch:
  push:
    branches: [research/stgr-lscb-v15]
    paths: [research/stgr-lscb-v15/RUN_SHADOW_V15]

permissions:
  contents: write
  id-token: write

jobs:
  shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          project_id: ${{ vars.STGR_GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.STGR_GCP_WIF_PROVIDER }}
          service_account: ${{ vars.STGR_GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m py_compile research/stgr-lscb-v15/run_shadow_v15.py
      - run: python research/stgr-lscb-v15/run_shadow_v15.py
      - name: Persist
        run: |
          git config user.name "stgr-research-bot"
          git config user.email "stgr-research-bot@users.noreply.github.com"
          git add research/stgr-lscb-v15/GEMINI_SHADOW_RESULTS_V1_5.json
          git commit -m "research(stgr): persist v1.5 shadow results [skip ci]"
          git pull --rebase origin research/stgr-lscb-v15
          git push origin HEAD:research/stgr-lscb-v15
