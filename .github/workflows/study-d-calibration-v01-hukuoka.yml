name: Study D Calibration v0.1 on HUKUOKA

on:
  push:
    branches:
      - research/methodological-framing-v01
    paths:
      - '.github/workflows/study-d-calibration-v01-hukuoka.yml'

permissions:
  contents: write

jobs:
  calibrate:
    runs-on: [self-hosted, HUKUOKA, research]
    timeout-minutes: 180
    defaults:
      run:
        shell: powershell

    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/methodological-framing-v01
          fetch-depth: 0
          clean: true

      - name: Confirm canonical HUKUOKA runner
        run: |
          Write-Output "COMPUTERNAME=$env:COMPUTERNAME"
          if ($env:COMPUTERNAME -ne 'HUKUOKA') { throw "Wrong runner: $env:COMPUTERNAME" }
          python --version

      - name: Run frozen Study D calibration
        working-directory: research/methodological-framing-v01
        run: |
          python run_study_d_calibration_v01.py

      - name: Analyze frozen Study D calibration
        working-directory: research/methodological-framing-v01
        run: |
          python analyze_study_d_calibration_v01.py

      - name: Secret scan
        working-directory: research/methodological-framing-v01
        run: |
          $hits = Get-ChildItem study_d_calibration_v01 -Recurse -File | Select-String -Pattern 'sk-proj-|Bearer sk-' -ErrorAction SilentlyContinue
          if ($hits) { $hits | Select-Object Path,LineNumber; throw "Secret-like material detected" }
          Write-Output "SECRET_SCAN=PASS"

      - name: Commit calibration outputs
        run: |
          git config user.name "methodological-framing-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git add research/methodological-framing-v01/study_d_calibration_v01
          git diff --cached --check
          if (git diff --cached --quiet) {
            Write-Output "NO_CHANGES_TO_COMMIT"
          } else {
            git commit -m "research complete Study D calibration v01"
            git push origin HEAD:research/methodological-framing-v01
          }
