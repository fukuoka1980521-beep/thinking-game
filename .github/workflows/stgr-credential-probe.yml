name: STGR Credential Presence Probe

on:
  push:
    branches:
      - research/stgr-lscb-v04
    paths:
      - research/stgr-lscb-v04/CREDENTIAL_PROBE

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      HAS_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY != '' }}
      HAS_GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY != '' }}
      HAS_VERTEX_API_KEY: ${{ secrets.VERTEX_API_KEY != '' }}
      HAS_XAI_API_KEY: ${{ secrets.XAI_API_KEY != '' }}
      HAS_GROK_API_KEY: ${{ secrets.GROK_API_KEY != '' }}
      HAS_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY != '' }}
      HAS_ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
      HAS_CLAUDE_OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
      HAS_GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID != '' }}
      HAS_GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER != '' }}
      HAS_GCP_DEPLOY_SA: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT != '' }}
    steps:
      - name: Report presence only
        run: |
          env | grep '^HAS_' | sort
