name: Latent State Research CI

on:
  pull_request:
    branches:
      - research/stgr-lscb-v20
    paths:
      - "research/latent-state-v01/**"
      - ".github/workflows/latent-state-research-ci.yml"
  push:
    branches:
      - "research/latent-state-*"
    paths:
      - "research/latent-state-v01/**"
      - ".github/workflows/latent-state-research-ci.yml"

permissions:
  contents: read

jobs:
  latent-state-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install analysis dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scikit-learn

      - name: Run latent-state analyzer tests
        run: |
          python research/latent-state-v01/scripts/test_analyze_latent_structure.py

      - name: Run latent-state capture tests
        run: |
          python research/latent-state-v01/scripts/test_capture_case.py

      - name: Run answer-variance comparator tests
        run: |
          python research/latent-state-v01/scripts/test_compare_answer_pair.py

      - name: Run natural-event triage tests
        run: |
          python research/latent-state-v01/scripts/test_triage_natural_event.py

      - name: Run matched-control selector tests
        run: |
          python research/latent-state-v01/scripts/test_select_matched_control.py

      - name: Validate historical calibration boundary
        run: |
          python research/latent-state-v01/scripts/analyze_latent_structure.py             research/latent-state-v01/historical/STGR6_FEATURE_MAPPING.jsonl             --dataset-role HISTORICAL_NOT_PROSPECTIVE             --output /tmp/historical.json
          python - <<'PY'
          import json
          p="/tmp/historical.json"
          d=json.load(open(p,encoding="utf-8"))
          assert d["dataset_role"]=="HISTORICAL_NOT_PROSPECTIVE"
          assert d["n_cases_total"]==6
          assert d["n_event_cases"]==6
          assert d["n_matched_controls"]==0
          assert d["causal_interpretation_allowed"] is False
          assert d["structured_feature_svd"]["status"]=="INSUFFICIENT_OBSERVED_VARIATION"
          print("PASS historical boundary")
          PY

      - name: Validate prospective dataset when present
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("research/latent-state-v01/cases/prospective.jsonl")
          if not p.exists():
              print("PASS no prospective dataset yet")
              raise SystemExit(0)
          rows=[json.loads(x) for x in p.read_text(encoding="utf-8").splitlines() if x.strip()]
          ids=[r["case_id"] for r in rows]
          assert len(ids)==len(set(ids)), "duplicate prospective case_id"
          assert all(r.get("dataset_role")=="PROSPECTIVE" for r in rows)
          assert all(r.get("natural_case") is True for r in rows)
          print(f"PASS prospective dataset structure: {len(rows)} cases")
          PY
          if [ -f research/latent-state-v01/cases/prospective.jsonl ]; then
            python research/latent-state-v01/scripts/analyze_latent_structure.py               research/latent-state-v01/cases/prospective.jsonl               --dataset-role PROSPECTIVE               --output /tmp/prospective.json
          fi
