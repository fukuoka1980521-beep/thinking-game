name: NEW LIFE PR CI

on:
  pull_request:
    branches: [master]
    paths:
      - "src/newlife/**"
      - "tests/newlife*"
      - "scripts/newlife-deploy/**"
      - "functions/newlife-dialogue/**"
      - "src/App.tsx"
      - "docs/newlife/evaluation/**"
      - "tsconfig.json"
      - ".github/workflows/newlife-pr-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
