name: NEW LIFE Refoundation — Isolated Backend Deploy

# Permanent deploy route for the isolated NEW LIFE refoundation backend.
# After the one-time GCP WIF trust bootstrap is complete, pushes to
# chatgpt/newlife-refoundation-v1 deploy automatically. Until then the
# readiness job succeeds and the deploy job is cleanly skipped.
#
# This workflow deploys ONLY functions/newlife-refoundation-ai/. It never
# touches legacy public NEW LIFE functions or production route wiring.

on:
  workflow_dispatch: {}
  push:
    branches:
      - chatgpt/newlife-refoundation-v1
    paths:
      - "functions/newlife-refoundation-ai/**"
      - ".github/workflows/newlife-refoundation-live.yml"

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: gas-test-runner-20260620-wjxf
  GCP_DEPLOY_SERVICE_ACCOUNT: newlife-refoundation-deployer@gas-test-runner-20260620-wjxf.iam.gserviceaccount.com

concurrency:
  group: newlife-refoundation-live-deploy
  cancel-in-progress: false

jobs:
  readiness:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - name: Check permanent GCP trust configuration
        id: check
        env:
          GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
        run: |
          set -euo pipefail
          if [ -z "$GCP_WIF_PROVIDER" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "GCP_WIF_READY=NO"
            echo "Missing repository variable: GCP_WIF_PROVIDER"
            echo "The permanent deploy route is prepared but the one-time Google-side trust bootstrap is still pending."
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "GCP_WIF_READY=YES"

  deploy-and-smoke:
    needs: readiness
    if: needs.readiness.outputs.ready == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current refoundation candidate
        uses: actions/checkout@v4
        with:
          ref: chatgpt/newlife-refoundation-v1
          fetch-depth: 1

      - name: Capture exact source commit
        id: source
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "SOURCE_SHA=$sha"

      - name: Authenticate to Google Cloud via Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Verify required GCP APIs are enabled
        run: |
          set -euo pipefail
          required=(aiplatform.googleapis.com cloudfunctions.googleapis.com cloudbuild.googleapis.com run.googleapis.com artifactregistry.googleapis.com)
          enabled="$(gcloud services list --enabled --project "${{ env.GCP_PROJECT_ID }}" --format='value(config.name)')"
          missing=()
          for api in "${required[@]}"; do
            if ! grep -qx "$api" <<< "$enabled"; then
              missing+=("$api")
            fi
          done
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Required API(s) are disabled: ${missing[*]}"
            exit 1
          fi

      - name: Deploy isolated newlife-refoundation-ai
        id: deploy
        run: |
          set -euo pipefail
          RUNTIME_SA_FLAG=()
          if [ -n "${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}" ]; then
            RUNTIME_SA_FLAG=(--service-account="${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}")
          fi

          gcloud functions deploy newlife-refoundation-ai             --gen2             --runtime=nodejs20             --region=asia-northeast1             --source=functions/newlife-refoundation-ai             --entry-point=newlifeRefoundationAi             --trigger-http             --allow-unauthenticated             --memory=256Mi             --timeout=45s             --max-instances=1             --project="${{ env.GCP_PROJECT_ID }}"             --set-env-vars=GCP_PROJECT="${{ env.GCP_PROJECT_ID }}",NEWLIFE_REFOUNDATION_BUILD_SHA="${{ steps.source.outputs.sha }}"             "${RUNTIME_SA_FLAG[@]}"             --quiet

          uri="$(gcloud functions describe newlife-refoundation-ai             --gen2             --region=asia-northeast1             --project="${{ env.GCP_PROJECT_ID }}"             --format='value(serviceConfig.uri)')"

          if [ -z "$uri" ]; then
            echo "::error::Deployment produced no service URI."
            exit 1
          fi
          echo "uri=$uri" >> "$GITHUB_OUTPUT"

      - name: Smoke 0/6 — deployment identity
        run: |
          set -euo pipefail
          uri="${{ steps.deploy.outputs.uri }}"
          payload="$(curl -fsS --max-time 20 "$uri")"
          node -e '
            const p=JSON.parse(process.argv[1]);
            const expected=process.argv[2];
            if(!p || p.service!=="newlife-refoundation-ai") throw new Error("wrong service");
            if(typeof p.buildSha!=="string" || p.buildSha!==expected) throw new Error("build SHA mismatch");
            if(p.contractVersion!=="V45") throw new Error("contract version mismatch");
            if(!Array.isArray(p.operations) || !p.operations.includes("converse_turn") || !p.operations.includes("continue_npc_exchange") || !p.operations.includes("organize_thought")) throw new Error("operation set mismatch");
            console.log("health/build identity OK:", p.buildSha);
          ' "$payload" "${{ steps.source.outputs.sha }}"

      - name: Smoke 1/6 — converse_turn
        run: |
          set -euo pipefail
          uri="${{ steps.deploy.outputs.uri }}"
          body='{"operation":"converse_turn","caseId":"COMMUNITY_THEATER_V1","targetNpc":"MIKA","rawPlayerUtterance":"変更案を出すなら、あなたに必要な最低条件は何ですか？","recentDialogue":[{"speaker":"MIKA","text":"この場面、明日はやりません。ここを変えないなら、私は出ません。"},{"speaker":"RYO","text":"昨日まではやってただろ。今ここで変えたら、全員の段取りが崩れる。"}],"dynamicState":{"relationshipState":"NEUTRAL","boundaryStatus":"UNKNOWN","remainingMinutes":50,"activeCommitment":null}}'
          payload="$(curl -fsS --max-time 55 -X POST "$uri" -H 'Content-Type: application/json' -d "$body")"
          node -e '
            const p=JSON.parse(process.argv[1]);
            if(!p || p.npc!=="MIKA" || typeof p.npcLine!=="string" || !p.npcLine.trim()) throw new Error("invalid converse response");
            if(!p.candidateTurn || typeof p.candidateTurn.action!=="string") throw new Error("candidate turn missing");
            if(!p.sceneRevisionProposal || typeof p.sceneRevisionProposal.hasProposal!=="boolean") throw new Error("scene revision proposal missing");
            console.log("converse_turn shape OK");
          ' "$payload"

      - name: Smoke 2/6 — second-case converse_turn
        run: |
          set -euo pipefail
          uri="${{ steps.deploy.outputs.uri }}"
          body='{"operation":"converse_turn","caseId":"STREET_TRIAL_V1","targetNpc":"HINA","rawPlayerUtterance":"何が問題になっているの？","recentDialogue":[{"speaker":"HINA","text":"合計は30点なんです。予約分も含めて書いただけです。"},{"speaker":"YOHEI","text":"予約12、店頭18だろ。見た人への約束は別だ。"}],"dynamicState":{"relationshipState":"NEUTRAL","boundaryStatus":"UNKNOWN","remainingMinutes":35,"activeCommitment":null,"sceneRevisionText":null}}'
          payload="$(curl -fsS --max-time 55 -X POST "$uri" -H 'Content-Type: application/json' -d "$body")"
          node -e '
            const p=JSON.parse(process.argv[1]);
            if(!p || p.npc!=="HINA" || typeof p.npcLine!=="string" || !p.npcLine.trim()) throw new Error("invalid street-trial response");
            if(!p.sceneRevisionProposal || p.sceneRevisionProposal.hasProposal!==false) throw new Error("street case must not invent script revision");
            console.log("street_trial converse_turn shape OK");
          ' "$payload"
      - name: Smoke 3/6 — street disagreement regression
        run: |
          set -euo pipefail
          uri="${{ steps.deploy.outputs.uri }}"
          body='{"operation":"converse_turn","caseId":"STREET_TRIAL_V1","targetNpc":"YOHEI","rawPlayerUtterance":"３０点買う人もいないし話せば伝わりますから問題ないです","recentDialogue":[{"speaker":"YOHEI","text":"予約12、店頭18。合計は30だ。見た人への約束は別だ。"}],"dynamicState":{"relationshipState":"NEUTRAL","boundaryStatus":"UNKNOWN","remainingMinutes":20,"activeCommitment":null,"sceneRevisionText":null}}'
          payload="$(curl -fsS --max-time 55 -X POST "$uri" -H 'Content-Type: application/json' -d "$body")"
          node -e '
            const p=JSON.parse(process.argv[1]);
            if(!p || p.npc!=="YOHEI" || typeof p.npcLine!=="string" || !p.npcLine.trim()) throw new Error("street disagreement response unusable");
            if(!p.sceneRevisionProposal || p.sceneRevisionProposal.hasProposal!==false) throw new Error("street disagreement leaked script metadata");
            console.log("street disagreement regression OK");
          ' "$payload"
      - name: Smoke 4/6 — ambiguous relationship converse_turn
        run: |
          set -euo pipefail
          uri="${{ steps.deploy.outputs.uri }}"
          body='{"operation":"converse_turn","caseId":"CAFE_BOUNDARY_V1","targetNpc":"MIYOKO","rawPlayerUtterance":"昨日の「手伝う」って、席を貸す意味まで含んでいたの？","recentDialogue":[{"speaker":"MIYOKO","text":"私は待合にするとは言ってないのよ。"},{"speaker":"FUMIKO","text":"でも、手伝えることがあればって言ってくれたでしょう。"}],"dynamicState":{"relationshipState":"NEUTRAL","boundaryStatus":"UNKNOWN","remainingMinutes":25,"activeCommitment":null,"sceneRevisionText":null}}'
          payload="$(curl -fsS --max-time 55 -X POST "$uri" -H 'Content-Type: application/json' -d "$body")"
          node -e '
            const p=JSON.parse(process.argv[1]);
            if(!p || p.npc!=="MIYOKO" || typeof p.npcLine!=="string" || !p.npcLine.trim()) throw new Error("invalid cafe-boundary response");
            if(!p.sceneRevisionProposal || p.sceneRevisionProposal.hasProposal!==false) throw new Error("cafe case leaked script metadata");
            console.log("cafe_boundary converse_turn shape OK");
          ' "$payload"
      - name: Smoke 5/6 — continue_npc_exchange
        run: |
          set -euo pipefail
          uri="${{ steps.deploy.outputs.uri }}"
          body='{"operation":"continue_npc_exchange","caseId":"COMMUNITY_THEATER_V1","targetNpc":"MIKA","recentDialogue":[{"speaker":"PLAYER","text":"二人で決めて進めてください。"},{"speaker":"RYO","text":"美香、この変更案なら進められるか？"}],"continuationDepth":1,"dynamicState":{"relationshipState":"NEUTRAL","boundaryStatus":"STATED","remainingMinutes":46,"activeCommitment":null}}'
          payload="$(curl -fsS --max-time 55 -X POST "$uri" -H 'Content-Type: application/json' -d "$body")"
          node -e '
            const p=JSON.parse(process.argv[1]);
            if(!p || p.npc!=="MIKA" || typeof p.npcLine!=="string" || !p.npcLine.trim()) throw new Error("invalid npc exchange response");
            if(!["AWAIT_PLAYER","NPC_EXCHANGE","RESOLVED","STALLED"].includes(p.sceneStatus)) throw new Error("scene status missing");
            console.log("continue_npc_exchange shape OK");
          ' "$payload"
      - name: Smoke 6/6 — organize_thought
        run: |
          set -euo pipefail
          uri="${{ steps.deploy.outputs.uri }}"
          body='{"operation":"organize_thought","validatedWorldFacts":"明日18:00が初回公演。チケットは販売済み。17:30までに対応方針を決める必要がある。","recentDialogue":[{"speaker":"MIKA","text":"この場面、明日はやりません。ここを変えないなら、私は出ません。"}],"currentProblem":"美香と亮の対立を理解し、明日の公演をどう進めるか決める。"}'
          payload="$(curl -fsS --max-time 55 -X POST "$uri" -H 'Content-Type: application/json' -d "$body")"
          node -e '
            const p=JSON.parse(process.argv[1]);
            if(!p || !Array.isArray(p.known) || !Array.isArray(p.possible) || !Array.isArray(p.unknown) || !Array.isArray(p.options)) throw new Error("invalid thought response");
            console.log("organize_thought shape OK");
          ' "$payload"

      - name: Emit permanent test route
        run: |
          {
            echo "### NEW LIFE isolated backend — deploy verified"
            echo ""
            echo "- Source SHA: `${{ steps.source.outputs.sha }}`"
            echo "- Endpoint: `${{ steps.deploy.outputs.uri }}`"
            echo "- Health/build identity: PASS"
            echo "- converse_turn (theater): PASS"
            echo "- converse_turn (street trial): PASS"
            echo "- street disagreement regression: PASS"
            echo "- converse_turn (ambiguous relationship): PASS"
            echo "- continue_npc_exchange: PASS"
            echo "- organize_thought: PASS"
            echo "- Human test page: https://fukuoka1980521-beep.github.io/thinking-game/newlife-v37.html"
            echo ""
            echo "Legacy public NEW LIFE was not modified."
          } >> "$GITHUB_STEP_SUMMARY"
