name: STGR v1.6 Shadow Baseline
on:
  workflow_dispatch:
  push:
    branches: [research/stgr-lscb-v16]
    paths: [research/stgr-lscb-v16/RUN_SHADOW_V16]
permissions:
  contents: write
  id-token: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          project_id: ${{ vars.STGR_GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.STGR_GCP_WIF_PROVIDER }}
          service_account: ${{ vars.STGR_GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python research/stgr-lscb-v16/run_shadow_v16.py
      - name: Persist
        run: |
          git config user.name "stgr-research-bot"
          git config user.email "stgr-research-bot@users.noreply.github.com"
          git add research/stgr-lscb-v16/GEMINI_SHADOW_RESULTS_V1_6.json
          git commit -m "research(stgr): persist v1.6 shadow baseline [skip ci]"
          git pull --rebase origin research/stgr-lscb-v16
          git push origin HEAD:research/stgr-lscb-v16
