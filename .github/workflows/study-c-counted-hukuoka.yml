name: Counted Study C on HUKUOKA

on:
  push:
    branches:
      - research/methodological-framing-v01
    paths:
      - '.github/workflows/study-c-counted-hukuoka.yml'

permissions:
  contents: write

jobs:
  study-c:
    runs-on: [self-hosted, HUKUOKA, research]
    timeout-minutes: 180
    defaults:
      run:
        shell: powershell

    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/methodological-framing-v01
          fetch-depth: 0
          clean: true

      - name: Confirm HUKUOKA
        run: |
          Write-Output "COMPUTERNAME=$env:COMPUTERNAME"
          if ($env:COMPUTERNAME -ne 'HUKUOKA') { throw "Wrong runner" }
          python --version

      - name: Compile counted Study C code
        working-directory: research/methodological-framing-v01
        run: |
          python -m py_compile run_study_c.py validate_study_c.py analyze_study_c.py freeze_study_c.py

      - name: Freeze Study C before counted data
        working-directory: research/methodological-framing-v01
        run: |
          python freeze_study_c.py

      - name: Commit freeze before counted collection
        run: |
          git config user.name "methodological-framing-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git add research/methodological-framing-v01/FROZEN_STUDY_C_MANIFEST_V1_0.jsonl research/methodological-framing-v01/STUDY_C_FREEZE_V1_0.json
          git diff --cached --check
          git commit -m "research freeze counted Study C before data"
          git push origin HEAD:research/methodological-framing-v01

      - name: Collect counted Study C
        working-directory: research/methodological-framing-v01
        run: |
          python run_study_c.py

      - name: Validate counted Study C
        working-directory: research/methodological-framing-v01
        run: |
          python validate_study_c.py

      - name: Analyze counted Study C
        working-directory: research/methodological-framing-v01
        run: |
          python analyze_study_c.py

      - name: Secret scan
        working-directory: research/methodological-framing-v01
        run: |
          $hits = Get-ChildItem study_c -Recurse -File | Select-String -Pattern 'sk-proj-|Bearer sk-' -ErrorAction SilentlyContinue
          if ($hits) { $hits | Select-Object Path,LineNumber; throw "Secret-like material detected" }
          Write-Output "SECRET_SCAN=PASS"

      - name: Commit counted Study C and results
        run: |
          git add research/methodological-framing-v01/study_c
          git diff --cached --check
          git commit -m "research complete counted Study C"
          git push origin HEAD:research/methodological-framing-v01
